name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude security & quality review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 需要先安装 claude CLI：npm install -g @anthropic-ai/claude-code
          npx @anthropic-ai/claude-code -p \
            "Review the changes in this PR for security issues and code quality.
            Focus on files changed: $(git diff --name-only origin/${{ github.base_ref }}...HEAD | head -20 | tr '\n' ' ')
            Check: OWASP top 10, logic errors, missing tests, breaking changes.
            Output findings as a markdown list with severity: [HIGH/MEDIUM/LOW]." \
            --allowedTools "Read,Glob,Grep" \
            --output-format text \
            > review-output.txt 2>&1 || true

          echo "## Claude Code Review" >> $GITHUB_STEP_SUMMARY
          cat review-output.txt >> $GITHUB_STEP_SUMMARY

      # 可选：把评审结果作为 PR comment 发出
